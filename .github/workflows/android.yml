name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Build debug APK
        run: gradle assembleDebug testDebugUnitTest
      - name: List native libraries in the APK
        run: unzip -l app/build/outputs/apk/debug/app-debug.apk | grep '\.so' | tee /dev/stderr | grep -q 'arm64-v8a/libggml-cpu-android_armv8.2_2.so'
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
