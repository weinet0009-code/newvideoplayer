name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Restore FFmpeg build
        id: ffcache
        uses: actions/cache/restore@v4
        with:
          path: app/ffmpeg
          key: ffmpeg-${{ hashFiles('ffmpeg/build.sh') }}
      - name: Build FFmpeg + dav1d (LGPL)
        if: steps.ffcache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q meson ninja-build pkg-config xz-utils make
          NDK="$ANDROID_HOME/ndk/27.0.12077973"
          if [ ! -d "$NDK" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.0.12077973" > /dev/null || NDK="$ANDROID_NDK_LATEST_HOME"
          fi
          echo "Using NDK $NDK"
          NDK="$NDK" bash ffmpeg/build.sh
      - name: Save FFmpeg build
        if: steps.ffcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: app/ffmpeg
          key: ffmpeg-${{ hashFiles('ffmpeg/build.sh') }}
      - name: Build debug APK
        run: gradle assembleDebug testDebugUnitTest
      - name: List native libraries in the APK
        run: |
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep '\.so' | tee libs.txt
          for lib in arm64-v8a/libggml-cpu-android_armv8.2_2.so arm64-v8a/libnvplame.so arm64-v8a/libnvpffmpeg.so armeabi-v7a/libnvpffmpeg.so x86_64/libnvpffmpeg.so; do
            grep -q "$lib" libs.txt || { echo "missing $lib"; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
